<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Prevent Flash of Unstyled Content (FOUC) for dark mode
      try {
        const saved = localStorage.getItem("color-scheme");
        if (saved) {
          document.querySelector('meta[name="color-scheme"]').content = saved;
        }
      } catch (e) {}
    </script>
    <title>Data Mühəndisi Müsahibə Hazırlığı | Atəşgah Sığorta</title>
    <meta name="description" content="Atəşgah Sığorta Şirkətində Data Mühəndisi vakansiyası üçün Elmarın fərdi hazırlıq platforması." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
